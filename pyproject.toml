[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hag"
version = "0.1.0"
description = "Hebbian adaptive growth experiments for reservoir computing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Tanguy Cazalets" },
]
dependencies = [
  "aeon>=0.10",
  "cmaes",
  "dcor",
  "imageio",
  "jax",
  "joblib",
  "librosa",
  "matplotlib",
  "networkx",
  "numpy",
  "optuna",
  "pandas",
  # branch v0.4.3-dev (LocalPlasticityReservoir.fit fix, reservoirpy PR #250) until reservoirpy 0.4.3 is released
  "reservoirpy @ git+https://github.com/reservoirpy/reservoirpy.git@5d3cb3eb3900714edd39fa28057198b49c208807",
  "scikit-learn",
  "scipy",
  "seaborn",
  "svgpath2mpl",
  "tensorflow",
  "torch",
  "torchaudio",
  "tqdm",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab",
  "jupyterlab-execute-time",
  "jupyterlab-optuna",
]

[project.urls]
Homepage = "https://github.com/Finebouche/HAG"
Repository = "https://github.com/Finebouche/HAG"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "hag",
  "hag.*",
]
exclude = [
  "outputs",
  "outputs.*",
]

[tool.setuptools.package-data]
"hag.metrics" = ["icons/*.svg"]
