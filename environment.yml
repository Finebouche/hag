name: hag_env
channels:
  - conda-forge
  - pytorch
dependencies:
  - python>=3.12
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - pandas
  - svgpath2mpl
  - scikit-learn
  - librosa
  - aeon>=0.10
  - ffmpeg
  - tensorflow
  - optuna
  - jupyterlab
  - optuna
  - tqdm
  - dcor
  - graph-tool
  - imageio
  - pip
  - pip:
    - jax
    # for now: development version of reservoirpy (local fork, branch based on v0.4.3-dev, with HAGReservoir and
    # block_input), installed in editable mode. Path relative to the repository root, where the environment is created
    # (micromamba env create -f environment.yml). Previously:
    # reservoirpy @ git+https://github.com/reservoirpy/reservoirpy.git@5d3cb3eb3900714edd39fa28057198b49c208807
    - -e ../../Autres/reservoirpy
    - torch
    - gymnasium[classic-control,box2d,mujoco]
    - stable-baselines3
    - popgym
    - torchaudio
    - jupyterlab-execute-time
    - jupyterlab-optuna
    - cmaes